PLG_FIELDS_PHOCAMD="Fields - PhocaMD"
PLG_FIELDS_PHOCAMD_DESCRIPTION="<div class=\"alert alert-info left\" style=\"text-align: left;\"><p>Phoca MD Fields Plugin - provides a custom Markdown field for Joomla articles. Instead of using a WYSIWYG editor like TinyMCE, you write your content in pure Markdown. On saving the article, the plugin automatically converts your Markdown into clean HTML and injects it directly into the standard Joomla Introtext and Fulltext fields.<br />Enable and publish this plugin in <a href=\"index.php?option=com_plugins\">Plug-in Manager</a></p><p>More information: <a href=\"https://www.phoca.cz/\" target=\"_blank\" >Phoca.cz</a></p><p>Documentation: <a href=\"https://www.phoca.cz/documentation/\" target=\"_blank\" >Phoca Documentation</a></p><p>Help and Support: <a href=\"https://www.phoca.cz/forum/\" target=\"_blank\" >Phoca Forum</a></p></div>"

PLG_FIELDS_PHOCAMD="Fields - PhocaMD"
PLG_FIELDS_PHOCAMD_DESCRIPTION="<div class=\"alert alert-info left\" style=\"text-align: left;\"><p>Phoca MD Fields Plugin - provides a custom Markdown field for Joomla articles. Instead of using a WYSIWYG editor like TinyMCE, you write your content in pure Markdown. On saving the article, the plugin automatically converts your Markdown into clean HTML and injects it directly into the standard Joomla Introtext and Fulltext fields.<br />Enable and publish this plugin in <a href=\"index.php?option=com_plugins\">Plug-in Manager</a></p><p>More information: <a href=\"https://www.phoca.cz/\" target=\"_blank\" >Phoca.cz</a></p><p>Documentation: <a href=\"https://www.phoca.cz/documentation/\" target=\"_blank\" >Phoca Documentation</a></p><p>Help and Support: <a href=\"https://www.phoca.cz/forum\" target=\"_blank\">Phoca Forum</a></p><h3>Free and Open Source Software (FOSS) Declaration</h3><p>This project is developed, distributed, and maintained strictly as Free and Open Source Software (FOSS). It is provided entirely outside the course of any commercial activity as an independent public resource.</p><p>For more details, please refer to the FOSS.md file included in this package. Feel free to contribute and follow the development on public, independent GitHub pages at <a href=\"https://github.com/PhocaCz\" target=\"_blank\">https://github.com/PhocaCz</a></p></div>"

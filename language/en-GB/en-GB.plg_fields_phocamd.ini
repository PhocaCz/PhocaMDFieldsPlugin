PLG_FIELDS_PHOCAMD_LABEL="Content (Markdown)"
PLG_FIELDS_PHOCAMD_DESCRIPTION_FIELD="If filled, overwrites the HTML content of the article on save. Use ===more=== to split into intro text and full text."
PLG_FIELDS_PHOCAMD_EXTRACT_TITLE_LABEL="Extract Main Title"
PLG_FIELDS_PHOCAMD_EXTRACT_TITLE_DESC="If enabled, a top-level heading (# Title) at the very beginning of the Markdown content will be automatically set as the Article Title and removed from the content body."
PLG_FIELDS_PHOCAMD_EDITOR_LOCKED="🔒 <strong>EDITOR LOCKED</strong><br>Content is currently controlled by the Phoca MD field. This HTML editor is disabled and will be completely overwritten from Markdown on save. <ul><li>To use this HTML editor again, you must completely clear the Phoca MD field.</li><li>Always save the article after changing the Markdown content to see the changes (changes are generated upon saving).</li></ul>"
PLG_FIELDS_PHOCAMD="Fields - PhocaMD"
PLG_FIELDS_PHOCAMD_DESCRIPTION="<div class=\"alert alert-info left\" style=\"text-align: left;\"><p>Phoca MD Fields Plugin - provides a custom Markdown field for Joomla articles. Instead of using a WYSIWYG editor like TinyMCE, you write your content in pure Markdown. On saving the article, the plugin automatically converts your Markdown into clean HTML and injects it directly into the standard Joomla Introtext and Fulltext fields.<br />Enable and publish this plugin in <a href=\"index.php?option=com_plugins\">Plug-in Manager</a></p><p>More information: <a href=\"https://www.phoca.cz/\" target=\"_blank\" >Phoca.cz</a></p><p>Documentation: <a href=\"https://www.phoca.cz/documentation/\" target=\"_blank\" >Phoca Documentation</a></p><p>Help and Support: <a href=\"https://www.phoca.cz/forum/\" target=\"_blank\" >Phoca Forum</a></p></div>"
